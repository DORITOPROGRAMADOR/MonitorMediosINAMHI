name: Actualizar noticias INAMHI
on:
  schedule:
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Buscar noticias y publicar
        run: python3 monitor_inamhi.py
